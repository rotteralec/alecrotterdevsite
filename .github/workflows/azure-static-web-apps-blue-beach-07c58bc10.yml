# Builds the site with Deno, then uploads the static dist/ folder to
# Azure Static Web Apps. The build happens HERE because Azure's Oryx
# build system cannot build Deno projects — that's why skip_app_build
# is set on the deploy step.

name: Build and deploy to Azure Static Web Apps - AlecRotter

on:
  push:
    branches:
      - main
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install

      - name: Build
        run: deno task build        # runs "vite build" -> dist/

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_BEACH_07C58BC10 }}
          action: "upload"
          app_location: "dist"    # the folder Vite just built
          output_location: ""     # must be empty when skipping the build
          skip_app_build: true    # we already built it above
